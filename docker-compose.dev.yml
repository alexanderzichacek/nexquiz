services:
  api:
    # own tag: the build-stage image must never replace the production `nexquiz-api` image
    image: nexquiz-api-dev
    build:
      target: build
    command: npm run dev        # tsx watch (api) + vite (web, proxies /api, /media and /socket.io to :3000)
    environment:
      NODE_ENV: development
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "3000:3000"
      - "5173:5173"
